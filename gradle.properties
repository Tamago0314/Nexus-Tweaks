# ── Gradle 本体の設定 ────────────────────────────────────────────────
# デーモンを使い回してビルド起動を速くする。
org.gradle.daemon=true
# 単一プロジェクトなので並列実行の恩恵は無い。無効にして挙動を単純に保つ。
org.gradle.parallel=false
# ビルドキャッシュは有効。再ビルドが速くなる。
org.gradle.caching=true
# Loom は Minecraft の展開やリマップでメモリを食うので多めに渡す。
# ソースファイルの文字コードは UTF-8 に固定する（日本語コメントが化けないように）。
org.gradle.jvmargs=-Xmx4G -Xms1G -Dfile.encoding=UTF-8

# ── Minecraft / Fabric のバージョン ──────────────────────────────────
minecraft_version=26.2
# fabric.mod.json の depends.minecraft に入る対応範囲。
minecraft_range=>=26.2 <26.3
loader_version=0.19.5
fabric_api_version=0.159.0+26.2

# 26.x は Mojang が難読化マップを公開していないため、マッピングを一切与えずに
# 素の（＝Mojang 公式の）クラス名・メソッド名でコンパイルする。
# これに伴い Loom は mappings / modImplementation コンフィギュレーションを作らず、
# remapJar タスクも登録しない（成果物は jar タスクが直接出す）。
fabric.loom.disableObfuscation=true

# 26.x は Java 25 が必須（1.21.11 までは 21 だった）。
java_version=25

# 26.1 で fabric-api の provides から "fabric" が消えたため、
# fabric.mod.json の depends では傘の mod id "fabric-api" を直に要求する。
# ここを "fabric" のままにすると実行時に HARD_DEP_NO_CANDIDATE で落ちる（ビルド時は無症状）。
fabric_api_mod_id=fabric-api

# ── malilib ──────────────────────────────────────────────────────────
# Modrinth maven から取得する。26.2 向けの最新は 0.29.6。
malilib_version=0.29.6
# fabric.mod.json の depends.malilib に入る下限。
malilib_min=0.29.6

# ── Item Scroller（任意の連携先） ────────────────────────────────────
# massCraft の代行で Item Scroller の処理に割り込むため、コンパイル時だけ参照する（配布物には入れない）。
# Modrinth maven から取得する。slug は "item-scroller" で、バージョン欄には
# 版番号ではなく Modrinth のバージョン ID を書く。
#   dfYfqZ8t = Item Scroller 0.32.2（26.2 向け）
itemscroller_version=dfYfqZ8t
# fabric.mod.json の suggests.itemscroller に入る下限。
# 実際に代行を有効にするかは、起動時に割り込み先のメソッドが実在するかで決めるので、
# 新しい版が出てもここを直す必要は無い（ItemScrollerMixinPlugin を参照）。
itemscroller_min=0.32.0

# ── MOD 自身のメタデータ ─────────────────────────────────────────────
mod_id=nexus-tweaks
mod_name=Nexus-Tweaks
mod_version=1.0.1
maven_group=com.hikariserver
archives_base_name=nexus-tweaks
